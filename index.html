<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini VS Code Mobile - Tối Ưu Điện Thoại</title>
    <style>
        :root {
            --bg-base: #1e1e1e;
            --sidebar-bg: #252526;
            --activity-bar: #333333;
            --tab-bg: #2d2d2d;
            --tab-active: #1e1e1e;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --border-color: #3f3f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Thanh Header trên cùng */
        header {
            background-color: var(--activity-bar);
            padding: 10px 8px;
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .btn-action {
            background-color: #FF9A00;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-run {
            background-color: #2ea44f;
            border: none;
            font-weight: 600;
        }

        .btn-console {
            background-color: #007acc;
            border: none;
            font-weight: 600;
        }

        .workspace {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Menu Sidebar quản lý file trượt từ trái sang */
        .sidebar {
            position: absolute;
            left: -100%;
            top: 0;
            width: 85%;
            max-width: 320px;
            height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: left 0.25s ease-in-out;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #969696;
            background: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-toolbar {
            padding: 8px;
            background: #222;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 6px;
        }

        .sidebar-toolbar button {
            background: #2a2d2e;
            color: #d4d4d4;
            border: 1px solid #454545;
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .folder-group-header {
            padding: 8px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #c586c0;
            background: rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-actions-inline {
            display: flex;
            gap: 3px;
        }

        .folder-actions-inline button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            color: #ccc;
            font-size: 0.65rem;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 3px;
        }

        .file-item {
            padding: 2px 8px;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background-color: rgba(0, 122, 204, 0.15);
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 122, 204, 0.8), 0 0 12px rgba(56, 189, 248, 0.6);
            box-shadow: inset 2px 0 0 var(--accent-color);
        }

        .file-item.active {
            background-color: #37373d;
            color: #ffffff;
            border-left: 3px solid var(--accent-color);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        .file-delete-btn {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 6px;
            transition: text-shadow 0.2s ease;
        }

        .file-delete-btn:hover {
            text-shadow: 0 0 8px rgba(248, 113, 113, 0.8);
        }

        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            overflow: hidden;
        }

        .tabs-bar {
            background-color: var(--sidebar-bg);
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .tab {
            padding: 8px 12px;
            font-size: 0.78rem;
            background-color: var(--tab-bg);
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            color: #969696;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tab.active {
            background-color: var(--tab-active);
            color: #ffffff;
            border-top: 2px solid var(--accent-color);
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 400px;
            background-color: var(--bg-base);
            color: var(--text-color);
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            line-height: 1.5;
            -webkit-appearance: none;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #analyzer-view {
            display: none;
            width: 100%;
            height: 300px;
            background: #1e1e1e;
            color: #38bdf8;
            padding: 16px;
            font-family: monospace;
            font-size: 0.82rem;
            overflow-y: auto;
            line-height: 1.6;
        }

        .preview-pane, .console-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 200;
            display: none;
            flex-direction: column;
        }

        .preview-pane.active, .console-pane.active {
            display: flex;
        }

        .preview-header, .console-pane-header {
            background-color: #f0f0f0;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #333;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-pane {
            background-color: #121212;
            color: #d4d4d4;
        }

        .console-pane-header {
            background-color: #252526;
            color: #9cdcfe;
            border-bottom: 1px solid var(--border-color);
        }

        #preview-iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }

        #error-console {
            flex: 1;
            background: #000;
            color: #38bdf8;
            padding: 12px;
            font-family: monospace;
            font-size: 0.78rem;
            overflow-y: auto;
            line-height: 1.5;
            -webkit-overflow-scrolling: touch;
        }

        .backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 90;
            display: none;
        }
        .backdrop.show {
            display: block;
        }

#currentFileName {
    font-size: 0.75rem; 
    color: #9cdcfe; 
    background-color: #D46D25; /* Màu nền bạn muốn đổi (ví dụ: màu tối đồng bộ) */
    padding: 4px 8px;          /* Khoảng cách đệm xung quanh chữ */
    border-radius: 4px;        /* Bo tròn góc khung nền */
    border: 1px solid #3f3f46; /* Viền nhẹ cho nổi bật */
    overflow: hidden; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
    max-width: 130px;
}


    </style>
</head>
<body>

    <header>
        <button class="btn-action" onclick="toggleSidebar()">📁 Menu</button>
        <span id="currentFileName" >index.html</span>
        <div class="header-actions">
            <button class="btn-action btn-console" onclick="openConsole()">💻 Lỗi</button>
            <button class="btn-action" onclick="downloadProject()">📥 Tải</button>
            <button class="btn-action btn-run" onclick="runProject()">▶ Chạy</button>
        </div>
    </header>

    <div class="workspace">
        <div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>📁 Quản Lý Tầng & File</span>
                <span onclick="toggleSidebar()" style="font-size:1.2rem; cursor:pointer; padding: 0 5px;">✕</span>
            </div>
            <div class="sidebar-toolbar">
                <button onclick="addNewTier()">➕ Thêm Tầng Mới</button>
            </div>
            <ul class="file-list" id="fileListUI"></ul>
        </div>

        <div class="editor-container">
            <div class="tabs-bar" id="tabsBarUI"></div>
            <div class="editor-pane">
                <textarea id="codeEditor" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Chọn file để chỉnh sửa..."></textarea>
                <div id="analyzer-view"></div>
            </div>
        </div>

        <div class="preview-pane" id="previewPane">
            <div class="preview-header">
                <span>🌐 Kết Quả Trực Quan</span>
                <button class="btn-action" style="background:#333; padding:4px 8px;" onclick="closePreview()">✕ Đóng</button>
            </div>
            <iframe id="preview-iframe"></iframe>
        </div>

        <div class="console-pane" id="consolePane">
            <div class="console-pane-header">
                <span>💻 Trạng Thái & Bắt Lỗi</span>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="cursor:pointer; color:#888; font-size:0.75rem;" onclick="document.getElementById('error-console').innerHTML='> Đã xóa log.'">🗑️ Xóa</span>
                    <button class="btn-action" style="background:#333; padding:4px 8px;" onclick="closeConsole()">✕ Đóng</button>
                </div>
            </div>
            <div id="error-console">> Đã sẵn sàng trên điện thoại. Các tầng quản lý HTML, CSS, JS, Thư viện hoạt động bình thường.</div>
        </div>
    </div>

    <script>
        let projectTiers = JSON.parse(localStorage.getItem('my_project_tiers_v8')) || [1, 2, 3];
        let projectFiles = JSON.parse(localStorage.getItem('my_project_files_v8')) || {
            "index.html": { 
                type: "html", 
                content: '<div style="padding:20px; font-family:sans-serif; text-align:center;">\n    <h2>Hệ Thống Mobile Đa Tầng</h2>\n    <p id="status-text" style="color:blue; margin-top:10px;">Firebase đã được tích hợp thành công!</p>\n</div>' 
            },
            "libs/tang1/firebase-config.html": {
                type: "lib",
                content: `<!-- Firebase SDK & Config -->\n<script type="module">\n  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";\n  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";\n\n  const firebaseConfig = {\n    apiKey: "AIzaSyAF6g3aSW-TvOGiNeG1_yh8dx6Pb8CakSQ",\n    authDomain: "vscodemini.firebaseapp.com",\n    projectId: "vscodemini",\n    storageBucket: "vscodemini.firebasestorage.app",\n    messagingSenderId: "522737122764",\n    appId: "1:522737122764:web:59d23b981fa62d27a5b169",\n    measurementId: "G-63CCHD7K"\n  };\n\n  const app = initializeApp(firebaseConfig);\n  const analytics = getAnalytics(app);\n  console.log("Firebase initialized successfully!");\n<\/script>`
            }
        };

        projectTiers.forEach(tier => {
            if (!Object.keys(projectFiles).some(f => f.startsWith(`html/tang${tier}/`))) {
                projectFiles[`html/tang${tier}/block1.html`] = { type: "html", content: `<!-- HTML Tầng ${tier} -->\n` };
            }
            if (!Object.keys(projectFiles).some(f => f.startsWith(`css/tang${tier}/`))) {
                projectFiles[`css/tang${tier}/style1.css`] = { type: "css", content: `/* CSS Tầng ${tier} */\n` };
            }
            if (!Object.keys(projectFiles).some(f => f.startsWith(`js/tang${tier}/`))) {
                projectFiles[`js/tang${tier}/module1.js`] = { type: "js", content: `// JS Tầng ${tier}\n` };
            }
            if (!Object.keys(projectFiles).some(f => f.startsWith(`libs/tang${tier}/`)) && tier !== 1) {
                projectFiles[`libs/tang${tier}/cdn1.html`] = { type: "lib", content: `<!-- CDN Tầng ${tier} -->\n` };
            }
        });

        let currentActiveFile = "index.html";
        let openTabs = ["index.html"];
        const codeEditor = document.getElementById('codeEditor');
        const analyzerView = document.getElementById('analyzer-view');

        codeEditor.addEventListener('input', (e) => {
            if (projectFiles[currentActiveFile]) {
                projectFiles[currentActiveFile].content = e.target.value;
                saveData();
            }
        });

        function saveData() {
            localStorage.setItem('my_project_tiers_v8', JSON.stringify(projectTiers));
            localStorage.setItem('my_project_files_v8', JSON.stringify(projectFiles));
        }

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('backdrop').classList.toggle('show');
        }

        function renderFileList() {
            const fileListUI = document.getElementById('fileListUI');
            fileListUI.innerHTML = '';
            
            const analyzeLi = document.createElement('li');
            analyzeLi.className = `file-item ${currentActiveFile === 'ANALYZE_TOOL' ? 'active' : ''}`;
            analyzeLi.innerHTML = `📊 <span style="color:#38bdf8; font-weight:bold;">Báo Cáo Tổng Hợp</span>`;
            analyzeLi.onclick = () => { window.openAnalyzer(); window.toggleSidebar(); };
            fileListUI.appendChild(analyzeLi);

            const rootHeader = document.createElement('div');
            rootHeader.className = 'folder-group-header';
            rootHeader.innerHTML = `<span>📁 Gốc (Root)</span>`;
            fileListUI.appendChild(rootHeader);

            const rootLi = document.createElement('li');
            rootLi.className = `file-item ${'index.html' === currentActiveFile ? 'active' : ''}`;
            rootLi.innerHTML = `🌐 <span>index.html</span>`;
            rootLi.onclick = () => { window.openFile('index.html'); window.toggleSidebar(); };
            fileListUI.appendChild(rootLi);

            projectTiers.forEach(tier => {
                const groupHeader = document.createElement('div');
                groupHeader.className = 'folder-group-header';
                groupHeader.innerHTML = `
                    <span>📁 Tầng ${tier}</span>
                    <div class="folder-actions-inline">
                        <button onclick="event.stopPropagation(); addNewHtml(${tier})">+HTML</button>
                        <button onclick="event.stopPropagation(); addNewCss(${tier})">+CSS</button>
                        <button onclick="event.stopPropagation(); addNewModule(${tier})">+JS</button>
                        <button onclick="event.stopPropagation(); addNewLib(${tier})">+Lib</button>
                        <button onclick="event.stopPropagation(); deleteTier(${tier})" style="color:#f87171;">🗑️</button>
                    </div>
                `;
                fileListUI.appendChild(groupHeader);

                ['html', 'css', 'js', 'libs'].forEach(type => {
                    let prefix = type === 'libs' ? `libs/tang${tier}/` : `${type}/tang${tier}/`;
                    let icon = type === 'html' ? '📄' : type === 'css' ? '🎨' : type === 'js' ? '⚡' : '📦';
                    
                    Object.keys(projectFiles).forEach(filename => {
                        if (filename.startsWith(prefix)) {
                            let name = filename.split('/').pop();
                            const li = document.createElement('li');
                            li.className = `file-item ${filename === currentActiveFile ? 'active' : ''}`;
                            li.innerHTML = `
                                <span style="flex:1;" onclick="window.openFile('${filename}'); window.toggleSidebar();">${icon} ${name}</span>
                                <button class="file-delete-btn" onclick="event.stopPropagation(); deleteSpecificFile('${filename}', '${type}')">✕</button>
                            `;
                            fileListUI.appendChild(li);
                        }
                    });
                });
            });
        }

        window.addNewTier = function() {
            let newTier = projectTiers.length > 0 ? Math.max(...projectTiers) + 1 : 1;
            projectTiers.push(newTier);
            projectFiles[`html/tang${newTier}/block1.html`] = { type: "html", content: `<!-- HTML Tầng ${newTier} -->\n` };
            projectFiles[`css/tang${newTier}/style1.css`] = { type: "css", content: `/* CSS Tầng ${newTier} */\n` };
            projectFiles[`js/tang${newTier}/module1.js`] = { type: "js", content: `// JS Tầng ${newTier}\n` };
            projectFiles[`libs/tang${newTier}/cdn1.html`] = { type: "lib", content: `<!-- CDN Tầng ${newTier} -->\n` };
            saveData();
            renderFileList();
        }

        window.deleteTier = function(tier) {
            if (projectTiers.length <= 1) {
                alert("Cần giữ lại ít nhất 1 tầng!");
                return;
            }
            if (confirm(`Xóa toàn bộ Tầng ${tier}?`)) {
                Object.keys(projectFiles).forEach(filename => {
                    if (filename.includes(`/tang${tier}/`)) {
                        delete projectFiles[filename];
                        openTabs = openTabs.filter(t => t !== filename);
                    }
                });
                projectTiers = projectTiers.filter(t => t !== tier);
                saveData();
                if (!projectFiles[currentActiveFile]) window.openFile("index.html");
                else renderFileList();
            }
        }

        window.addNewHtml = function(tier) {
            let existing = Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`));
            let nextIndex = existing.length + 1;
            while(projectFiles[`html/tang${tier}/block${nextIndex}.html`]) nextIndex++;
            let newFile = `html/tang${tier}/block${nextIndex}.html`;
            projectFiles[newFile] = { type: "html", content: `<!-- HTML Tầng ${tier} -->\n` };
            saveData();
            renderFileList();
            window.openFile(newFile);
            window.toggleSidebar();
        }

        window.addNewCss = function(tier) {
            let existing = Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`));
            let nextIndex = existing.length + 1;
            while(projectFiles[`css/tang${tier}/style${nextIndex}.css`]) nextIndex++;
            let newFile = `css/tang${tier}/style${nextIndex}.css`;
            projectFiles[newFile] = { type: "css", content: `/* CSS Tầng ${tier} */\n` };
            saveData();
            renderFileList();
            window.openFile(newFile);
            window.toggleSidebar();
        }

        window.addNewModule = function(tier) {
            let existing = Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`));
            let nextIndex = existing.length + 1;
            while(projectFiles[`js/tang${tier}/module${nextIndex}.js`]) nextIndex++;
            let newFile = `js/tang${tier}/module${nextIndex}.js`;
            projectFiles[newFile] = { type: "js", content: `// JS Tầng ${tier}\n` };
            saveData();
            renderFileList();
            window.openFile(newFile);
            window.toggleSidebar();
        }

        window.addNewLib = function(tier) {
            let existing = Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`));
            let nextIndex = existing.length + 1;
            while(projectFiles[`libs/tang${tier}/cdn${nextIndex}.html`]) nextIndex++;
            let newFile = `libs/tang${tier}/cdn${nextIndex}.html`;
            projectFiles[newFile] = { type: "lib", content: `<!-- CDN Tầng ${tier} -->\n` };
            saveData();
            renderFileList();
            window.openFile(newFile);
            window.toggleSidebar();
        }

        window.deleteSpecificFile = function(filename, type) {
            let count = Object.keys(projectFiles).filter(f => f.startsWith(type === 'lib' ? 'libs/' : type + '/')).length;
            if (count <= 1 && type !== 'html') {
                alert(`Cần giữ lại ít nhất 1 file ${type.toUpperCase()}!`);
                return;
            }
            if (confirm(`Xóa file ${filename}?`)) {
                delete projectFiles[filename];
                openTabs = openTabs.filter(t => t !== filename);
                saveData();
                if (currentActiveFile === filename) window.openFile("index.html");
                else renderFileList();
            }
        }

        function renderTabs() {
            const tabsBarUI = document.getElementById('tabsBarUI');
            tabsBarUI.innerHTML = '';
            openTabs.forEach(filename => {
                const tab = document.createElement('div');
                tab.className = `tab ${filename === currentActiveFile ? 'active' : ''}`;
                let displayName = filename === 'ANALYZE_TOOL' ? '📊 Phân Tích' : (filename.includes('/') ? filename.split('/').slice(-2).join('/') : filename);
                tab.innerHTML = `<span>${displayName}</span> <span onclick="event.stopPropagation(); window.closeTab('${filename}')" style="opacity:0.6; padding-left:4px;">✕</span>`;
                tab.onclick = () => filename === 'ANALYZE_TOOL' ? window.openAnalyzer() : window.switchFile(filename);
                tabsBarUI.appendChild(tab);
            });
        }

        window.openFile = function(filename) {
            if (!openTabs.includes(filename)) openTabs.push(filename);
            currentActiveFile = filename;
            codeEditor.style.display = 'block';
            analyzerView.style.display = 'none';
            codeEditor.value = projectFiles[filename] ? projectFiles[filename].content : '';
            document.getElementById('currentFileName').innerText = filename;
            renderFileList();
            renderTabs();
        }

        window.switchFile = function(filename) {
            currentActiveFile = filename;
            codeEditor.style.display = 'block';
            analyzerView.style.display = 'none';
            codeEditor.value = projectFiles[filename] ? projectFiles[filename].content : '';
            document.getElementById('currentFileName').innerText = filename;
            renderFileList();
            renderTabs();
        }

        window.openAnalyzer = function() {
            currentActiveFile = 'ANALYZE_TOOL';
            if (!openTabs.includes('ANALYZE_TOOL')) openTabs.push('ANALYZE_TOOL');
            codeEditor.style.display = 'none';
            analyzerView.style.display = 'block';
            document.getElementById('currentFileName').innerText = 'Báo Cáo Tổng Hợp';

            let report = "<h3>📊 TỔNG QUAN HỆ THỐNG</h3><hr style='border-color:#444; margin:10px 0'>";
            report += `<b>Tổng số tầng:</b> ${projectTiers.join(', ')}<br><br>`;
            projectTiers.forEach(tier => {
                let htmlC = Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`)).length;
                let cssC = Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).length;
                let jsC = Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).length;
                let libC = Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`)).length;
                report += `<b style='color:#eab308;'>🔹 Tầng ${tier}:</b> HTML:${htmlC} | CSS:${cssC} | JS:${jsC} | Libs:${libC}<br>`;
            });

            analyzerView.innerHTML = report;
            renderFileList();
            renderTabs();
        }

        window.closeTab = function(filename) {
            openTabs = openTabs.filter(f => f !== filename);
            if (openTabs.length === 0) openTabs.push("index.html");
            if (currentActiveFile === filename) {
                let next = openTabs[openTabs.length - 1];
                next === 'ANALYZE_TOOL' ? window.openAnalyzer() : window.switchFile(next);
            } else {
                renderTabs();
            }
        }

        window.runProject = function() {
            const iframe = document.getElementById('preview-iframe');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            let rootHtml = projectFiles["index.html"] ? projectFiles["index.html"].content : '';
            let combinedLibs = "", combinedCSS = "", combinedExtraHtml = "", combinedJS = "";

            projectTiers.forEach(tier => {
                Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedLibs += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedCSS += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedExtraHtml += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedJS += projectFiles[k].content + "\n"; });
            });

            const fullOutput = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">${combinedLibs}<style>${combinedCSS}</style></head><body>${rootHtml}${combinedExtraHtml}<script>window.onerror=function(m,u,l){window.parent.postMessage({type:'ERROR',message:m,line:l},'*');};try{${combinedJS}}catch(e){window.parent.postMessage({type:'ERROR',message:e.message},'*');}<\/script></body></html>`;

            iframeDoc.open();
            iframeDoc.write(fullOutput);
            iframeDoc.close();
            document.getElementById('previewPane').classList.add('active');
        }

        window.closePreview = function() {
            document.getElementById('previewPane').classList.remove('active');
        }

        window.openConsole = function() {
            document.getElementById('consolePane').classList.add('active');
        }

        window.closeConsole = function() {
            document.getElementById('consolePane').classList.remove('active');
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'ERROR') {
                let consoleEl = document.getElementById('error-console');
                consoleEl.innerHTML += `<br><span style="color:#f87171;">[Lỗi] ${event.data.message} ${event.data.line ? '(Dòng: '+event.data.line+')' : ''}</span>`;
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        });

        window.downloadProject = function() {
            let rootHtml = projectFiles["index.html"] ? projectFiles["index.html"].content : '';
            let combinedLibs = "", combinedCSS = "", combinedExtraHtml = "", combinedJS = "";

            projectTiers.forEach(tier => {
                Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedLibs += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedCSS += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedExtraHtml += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedJS += projectFiles[k].content + "\n"; });
            });

            let bundleContent = `<!DOCTYPE html>\n<html lang="vi">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${combinedLibs}\n<style>\n${combinedCSS}\n</style>\n</head>\n<body>\n${rootHtml}\n${combinedExtraHtml}\n<script>\n${combinedJS}\n<\/script>\n</body>\n</html>`;

            let blob = new Blob([bundleContent], { type: 'text/html' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }

        renderFileList();
        window.openFile("index.html");
    </script>
</body>
</html>
