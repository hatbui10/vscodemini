vào đây..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="preview-pane" id="previewPane">
            <div class="preview-header">
                <span>🌐 Kết Quả Trực Quan</span>
                <button class="btn-action" style="background:#333; padding:4px 8px;" onclick="closePreview()">✕ Đóng</button>
            </div>
            <iframe id="preview-iframe"></iframe>
        </div>

        <div class="console-pane" id="consolePane">
            <div class="console-pane-header">
                <span>💻 Trạng Thái & Bắt Lỗi</span>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="cursor:pointer; color:#888; font-size:0.75rem;" onclick="document.getElementById('error-console').innerHTML='> Đã xóa log.'">🗑️ Xóa</span>
                    <button class="btn-action" style="background:#333; padding:4px 8px;" onclick="closeConsole()">✕ Đóng</button>
                </div>
            </div>
            <div id="error-console">> Đã sẵn sàng trên điện thoại. Hệ thống kết nối Firebase Cloud Firestore hoạt động bình thường.</div>
        </div>
    </div>

    <!-- Hộp thoại nhập tên file tùy chỉnh -->
    <div class="modal-overlay" id="fileNameModal">
        <div class="modal-box">
            <h4 id="modalTitle">Nhập tên file mới</h4>
            <input type="text" id="fileNameInput" placeholder="Nhập tên file..." />
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeFileNameModal()">Hủy</button>
                <button class="btn-confirm" id="modalConfirmBtn">Tạo File</button>
            </div>
        </div>
    </div>

    <!-- Nhúng Firebase SDK kiểu Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAF6g3aSW-TvOGiNeG1_yh8dx6Pb8CakSQ",
            authDomain: "vscodemini.firebaseapp.com",
            projectId: "vscodemini",
            storageBucket: "vscodemini.firebasestorage.app",
            messagingSenderId: "522737122764",
            appId: "1:522737122764:web:59d23b981fa62d27a5b169",
            measurementId: "G-63CCHD7K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let projectTiers = JSON.parse(localStorage.getItem('my_project_tiers_v8')) || [1, 2, 3];
        let projectFiles = JSON.parse(localStorage.getItem('my_project_files_v8')) || {
            "index.html": { 
                type: "html", 
                content: '<div style="padding:20px; font-family:sans-serif; text-align:center;">\n    <h2>Hệ Thống Mobile Đa Tầng</h2>\n    <p id="status-text" style="color:blue; margin-top:10px;">Firebase đã được tích hợp thành công!</p>\n</div>' 
            },
            "libs/tang1/firebase-config.html": {
                type: "lib",
                content: `<!-- Firebase SDK & Config -->\n<script type="module">\n  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";\n\n  const firebaseConfig = {\n    apiKey: "AIzaSyAF6g3aSW-TvOGiNeG1_yh8dx6Pb8CakSQ",\n    authDomain: "vscodemini.firebaseapp.com",\n    projectId: "vscodemini",\n    storageBucket: "vscodemini.firebasestorage.app",\n    messagingSenderId: "522737122764",\n    appId: "1:522737122764:web:59d23b981fa62d27a5b169"\n  };\n  initializeApp(firebaseConfig);\n<\/script>`
            }
        };

        projectTiers.forEach(tier => {
            if (!Object.keys(projectFiles).some(f => f.startsWith(`html/tang${tier}/`) && f.endsWith('.div'))) {
                projectFiles[`html/tang${tier}/content.div`] = { type: "html", content: `<!-- Nội dung HTML/div Tầng ${tier} -->\n` };
            }
            if (!Object.keys(projectFiles).some(f => f.startsWith(`css/tang${tier}/`))) {
                projectFiles[`css/tang${tier}/style1.css`] = { type: "css", content: `/* CSS Tầng ${tier} */\n` };
            }
            if (!Object.keys(projectFiles).some(f => f.startsWith(`js/tang${tier}/`))) {
                projectFiles[`js/tang${tier}/module1.js`] = { type: "js", content: `// JS Tầng ${tier}\n` };
            }
            if (!Object.keys(projectFiles).some(f => f.startsWith(`libs/tang${tier}/`)) && tier !== 1) {
                projectFiles[`libs/tang${tier}/cdn1.html`] = { type: "lib", content: `<!-- CDN Tầng ${tier} -->\n` };
            }
        });

        let currentActiveFile = "index.html";
        let openTabs = ["index.html"];
        const codeEditor = document.getElementById('codeEditor');
        const lineNumbers = document.getElementById('lineNumbers');
        const analyzerView = document.getElementById('analyzer-view');
        const masterSplitterView = document.getElementById('master-splitter-view');
        const masterTextarea = document.getElementById('master-textarea');
        const masterLineNumbers = document.getElementById('master-line-numbers');

        function updateLineNumbers() {
            const lines = codeEditor.value.split('\n').length;
            let output = '';
            for (let i = 1; i <= lines; i++) {
                output += i + '<br>';
            }
            lineNumbers.innerHTML = output;
        }

        function updateMasterLineNumbers() {
            const lines = masterTextarea.value.split('\n').length;
            let output = '';
            for (let i = 1; i <= lines; i++) {
                output += i + '<br>';
            }
            masterLineNumbers.innerHTML = output;
        }

        codeEditor.addEventListener('scroll', () => {
            lineNumbers.style.transform = `translateY(-${codeEditor.scrollTop}px)`;
        });

        masterTextarea.addEventListener('scroll', () => {
            masterLineNumbers.style.transform = `translateY(-${masterTextarea.scrollTop}px)`;
        });

        async function syncToFirebase() {
            try {
                await setDoc(doc(db, "projects", "my_mobile_workspace"), {
                    tiers: projectTiers,
                    files: projectFiles,
                    updatedAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Lỗi đồng bộ Firebase:", err);
            }
        }

        let saveTimeout;
        codeEditor.addEventListener('input', (e) => {
            updateLineNumbers();
            if (projectFiles[currentActiveFile]) {
                projectFiles[currentActiveFile].content = e.target.value;
                saveData();
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => { syncToFirebase(); }, 1000);
            }
        });

        masterTextarea.addEventListener('input', () => {
            updateMasterLineNumbers();
            if (currentActiveFile.startsWith('MASTER_TIER_')) {
                let tier = currentActiveFile.split('_')[2];
                parseAndDistributeMasterContent(tier, masterTextarea.value, false);
            }
        });

        function saveData() {
            localStorage.setItem('my_project_tiers_v8', JSON.stringify(projectTiers));
            localStorage.setItem('my_project_files_v8', JSON.stringify(projectFiles));
        }

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('backdrop').classList.toggle('show');
        }

        function renderFileList() {
            const fileListUI = document.getElementById('fileListUI');
            fileListUI.innerHTML = '';
            
            const analyzeLi = document.createElement('li');
            analyzeLi.className = `file-item ${currentActiveFile === 'ANALYZE_TOOL' ? 'active' : ''}`;
            analyzeLi.innerHTML = `📊 <span style="color:#38bdf8; font-weight:bold;">Báo Cáo Tổng Hợp</span>`;
            analyzeLi.onclick = () => { window.openAnalyzer(); window.toggleSidebar(); };
            fileListUI.appendChild(analyzeLi);

            const rootHeader = document.createElement('div');
            rootHeader.className = 'folder-group-header';
            rootHeader.innerHTML = `<div class="folder-group-top"><span>📁 Gốc (Root)</span></div>`;
            fileListUI.appendChild(rootHeader);

            const rootLi = document.createElement('li');
            rootLi.className = `file-item ${'index.html' === currentActiveFile ? 'active' : ''}`;
            rootLi.innerHTML = `🌐 <span>index.html</span>`;
            rootLi.onclick = () => { window.openFile('index.html'); window.toggleSidebar(); };
            fileListUI.appendChild(rootLi);

            projectTiers.forEach(tier => {
                const groupHeader = document.createElement('div');
                groupHeader.className = 'folder-group-header';
                groupHeader.innerHTML = `
                    <div class="folder-group-top">
                        <span>📁 Tầng ${tier}</span>
                        <div class="folder-actions-inline">
                            <button onclick="event.stopPropagation(); window.openMaster(${tier})" style="color:#eab308; font-weight:bold;" title="Tách/Gộp">📥 Tách/Gộp</button>
                            <button onclick="event.stopPropagation(); promptAddFile(${tier}, 'html')">+HTML</button>
                            <button onclick="event.stopPropagation(); promptAddFile(${tier}, 'css')">+CSS</button>
                            <button onclick="event.stopPropagation(); promptAddFile(${tier}, 'js')">+JS</button>
                            <button onclick="event.stopPropagation(); deleteTier(${tier})" style="color:#f87171;" title="Xóa tầng">🗑️</button>
                        </div>
                    </div>
                `;
                fileListUI.appendChild(groupHeader);

                let masterKey = `MASTER_TIER_${tier}`;
                const masterItem = document.createElement('li');
                masterItem.className = `file-item ${masterKey === currentActiveFile ? 'active' : ''}`;
                masterItem.innerHTML = `⚡ <span style="color:#eab308; font-weight:bold;">[Ô Tổng Hợp Tầng ${tier}]</span>`;
                masterItem.onclick = () => { window.openMaster(tier); window.toggleSidebar(); };
                fileListUI.appendChild(masterItem);

                ['html', 'css', 'js', 'libs'].forEach(type => {
                    let prefix = type === 'libs' ? `libs/tang${tier}/` : `${type}/tang${tier}/`;
                    let icon = type === 'html' ? '📄' : type === 'css' ? '🎨' : type === 'js' ? '⚡' : '📦';
                    
                    Object.keys(projectFiles).forEach(filename => {
                        if (filename.startsWith(prefix)) {
                            let name = filename.split('/').pop();
                            const li = document.createElement('li');
                            li.className = `file-item ${filename === currentActiveFile ? 'active' : ''}`;
                            li.innerHTML = `
                                <span style="flex:1;" onclick="window.openFile('${filename}'); window.toggleSidebar();">${icon} ${name}</span>
                                <button class="file-delete-btn" onclick="event.stopPropagation(); deleteSpecificFile('${filename}', '${type}')">✕</button>
                            `;
                            fileListUI.appendChild(li);
                        }
                    });
                });
            });
        }

        window.addNewTier = function() {
            let newTier = projectTiers.length > 0 ? Math.max(...projectTiers) + 1 : 1;
            projectTiers.push(newTier);
            projectFiles[`html/tang${newTier}/content.div`] = { type: "html", content: `<!-- Nội dung HTML/div Tầng ${newTier} -->\n` };
            projectFiles[`css/tang${newTier}/style1.css`] = { type: "css", content: `/* CSS Tầng ${newTier} */\n` };
            projectFiles[`js/tang${newTier}/module1.js`] = { type: "js", content: `// JS Tầng ${newTier}\n` };
            projectFiles[`libs/tang${newTier}/cdn1.html`] = { type: "lib", content: `<!-- CDN Tầng ${newTier} -->\n` };
            saveData();
            syncToFirebase();
            renderFileList();
        }

        window.deleteTier = function(tier) {
            if (projectTiers.length <= 1) {
                alert("Cần giữ lại ít nhất 1 tầng!");
                return;
            }
            if (confirm(`Xóa toàn bộ Tầng ${tier}?`)) {
                Object.keys(projectFiles).forEach(filename => {
                    if (filename.includes(`/tang${tier}/`)) {
                        delete projectFiles[filename];
                        openTabs = openTabs.filter(t => t !== filename);
                    }
                });
                projectTiers = projectTiers.filter(t => t !== tier);
                saveData();
                syncToFirebase();
                if (!projectFiles[currentActiveFile]) window.openFile("index.html");
                else renderFileList();
            }
        }

        let activeModalTier = null;
        let activeModalType = null;

        window.promptAddFile = function(tier, type) {
            activeModalTier = tier;
            activeModalType = type;
            let extension = type === 'html' ? '.div' : type === 'css' ? '.css' : type === 'js' ? '.js' : '.html';
            
            document.getElementById('modalTitle').innerText = `Thêm file ${type.toUpperCase()} vào Tầng ${tier}`;
            let inputEl = document.getElementById('fileNameInput');
            inputEl.value = extension;
            
            document.getElementById('fileNameModal').classList.add('show');
            setTimeout(() => {
                inputEl.focus();
                inputEl.setSelectionRange(0, 0);
            }, 100);
        }

        window.closeFileNameModal = function() {
            document.getElementById('fileNameModal').classList.remove('show');
        }

        document.getElementById('modalConfirmBtn').onclick = function() {
            let userFilename = document.getElementById('fileNameInput').value.trim();
            if (!userFilename) {
                alert("Tên file không được để trống!");
                return;
            }

            let tier = activeModalTier;
            let type = activeModalType;
            let folderPrefix = type === 'lib' ? `libs/tang${tier}/` : `${type}/tang${tier}/`;
            let fullPath = folderPrefix + userFilename;

            if (projectFiles[fullPath]) {
                alert("Tên file này đã tồn tại trong tầng, vui lòng chọn tên khác!");
                return;
            }

            let defaultContent = type === 'html' ? `<!-- Nội dung Tầng ${tier} -->\n` : type === 'css' ? `/* CSS Tầng ${tier} */\n` : type === 'js' ? `// JS Tầng ${tier}\n` : `<!-- CDN Tầng ${tier} -->\n`;

            projectFiles[fullPath] = { type: type, content: defaultContent };
            saveData();
            syncToFirebase();
            renderFileList();
            window.openFile(fullPath);
            window.closeFileNameModal();
            window.toggleSidebar();
        }

        window.deleteSpecificFile = function(filename, type) {
            let count = Object.keys(projectFiles).filter(f => f.startsWith(type === 'lib' ? 'libs/' : type + '/')).length;
            if (count <= 1 && type !== 'html') {
                alert(`Cần giữ lại ít nhất 1 file ${type.toUpperCase()}!`);
                return;
            }
            if (confirm(`Xóa file ${filename}?`)) {
                delete projectFiles[filename];
                openTabs = openTabs.filter(t => t !== filename);
                saveData();
                syncToFirebase();
                if (currentActiveFile === filename) window.openFile("index.html");
                else renderFileList();
            }
        }

        function renderTabs() {
            const tabsBarUI = document.getElementById('tabsBarUI');
            tabsBarUI.innerHTML = '';
            openTabs.forEach(filename => {
                const tab = document.createElement('div');
                tab.className = `tab ${filename === currentActiveFile ? 'active' : ''}`;
                let displayName = filename === 'ANALYZE_TOOL' ? '📊 Phân Tích' : (filename.includes('/') ? filename.split('/').slice(-2).join('/') : filename);
                tab.innerHTML = `<span>${displayName}</span> <span onclick="event.stopPropagation(); window.closeTab('${filename}')" style="opacity:0.6; padding-left:4px;">✕</span>`;
                tab.onclick = () => filename === 'ANALYZE_TOOL' ? window.openAnalyzer() : window.switchFile(filename);
                tabsBarUI.appendChild(tab);
            });
        }

        window.openFile = function(filename) {
            if (!openTabs.includes(filename)) openTabs.push(filename);
            currentActiveFile = filename;
            
            lineNumbers.style.display = 'block';
            codeEditor.style.display = 'block';
            masterSplitterView.style.display = 'none';

            codeEditor.value = projectFiles[filename] ? projectFiles[filename].content : '';
            updateLineNumbers();
            document.getElementById('currentFileName').innerText = filename;
            renderFileList(); renderTabs();
        }

        window.switchFile = function(filename) {
            currentActiveFile = filename;
            
            lineNumbers.style.display = 'block';
            codeEditor.style.display = 'block';
            masterSplitterView.style.display = 'none';

            analyzerView.style.display = 'none';
            codeEditor.value = projectFiles[filename] ? projectFiles[filename].content : '';
            updateLineNumbers();
            document.getElementById('currentFileName').innerText = filename;
            renderFileList();
            renderTabs();
        }

        window.openAnalyzer = function() {
            currentActiveFile = 'ANALYZE_TOOL';
            if (!openTabs.includes('ANALYZE_TOOL')) openTabs.push('ANALYZE_TOOL');
            
            lineNumbers.style.display = 'none';
            codeEditor.style.display = 'none';
            masterSplitterView.style.display = 'none';
            analyzerView.style.display = 'block';
            document.getElementById('currentFileName').innerText = 'Báo Cáo Tổng Hợp';

            let report = "<h3>📊 TỔNG QUAN HỆ THỐNG</h3><hr style='border-color:#444; margin:10px 0'>";
            report += `<b>Tổng số tầng:</b> ${projectTiers.join(', ')}<br><br>`;
            projectTiers.forEach(tier => {
                let htmlC = Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`)).length;
                let cssC = Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).length;
                let jsC = Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).length;
                let libC = Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`)).length;
                report += `<b style='color:#eab308;'>🔹 Tầng ${tier}:</b> HTML/div:${htmlC} | CSS:${cssC} | JS:${jsC} | Libs:${libC}<br>`;
            });

            analyzerView.innerHTML = report;
            renderFileList();
            renderTabs();
        }

        window.closeTab = function(filename) {
            openTabs = openTabs.filter(f => f !== filename);
            if (openTabs.length === 0) openTabs.push("index.html");
            if (currentActiveFile === filename) {
                let next = openTabs[openTabs.length - 1];
                next === 'ANALYZE_TOOL' ? window.openAnalyzer() : window.switchFile(next);
            } else {
                renderTabs();
            }
        }

        window.runProject = function() {
            const iframe = document.getElementById('preview-iframe');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            let rootHtml = projectFiles["index.html"] ? projectFiles["index.html"].content : '';
            let combinedLibs = "", combinedCSS = "", combinedExtraHtml = "", combinedJS = "";

            projectTiers.forEach(tier => {
                Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedLibs += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedCSS += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedExtraHtml += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedJS += projectFiles[k].content + "\n"; });
            });

            const fullOutput = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">${combinedLibs}<style>${combinedCSS}</style></head><body>${rootHtml}${combinedExtraHtml}<script>window.onerror=function(m,u,l){window.parent.postMessage({type:'ERROR',message:m,line:l},'*');};try{${combinedJS}}catch(e){window.parent.postMessage({type:'ERROR',message:e.message},'*');}<\/script></body></html>`;

            iframeDoc.open();
            iframeDoc.write(fullOutput);
            iframeDoc.close();
            document.getElementById('previewPane').classList.add('active');
        }

        window.closePreview = function() {
            document.getElementById('previewPane').classList.remove('active');
        }

        window.openConsole = function() {
            document.getElementById('consolePane').classList.add('active');
        }

        window.closeConsole = function() {
            document.getElementById('consolePane').classList.remove('active');
        }

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'ERROR') {
                let consoleEl = document.getElementById('error-console');
                consoleEl.innerHTML += `<br><span style="color:#f87171;">[Lỗi] ${event.data.message} ${event.data.line ? '(Dòng: '+event.data.line+')' : ''}</span>`;
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        });

        window.downloadProject = function() {
            let rootHtml = projectFiles["index.html"] ? projectFiles["index.html"].content : '';
            let combinedLibs = "", combinedCSS = "", combinedExtraHtml = "", combinedJS = "";

            projectTiers.forEach(tier => {
                Object.keys(projectFiles).filter(f => f.startsWith(`libs/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedLibs += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedCSS += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedExtraHtml += projectFiles[k].content + "\n"; });
                Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).sort().forEach(k => { if(projectFiles[k]) combinedJS += projectFiles[k].content + "\n"; });
            });

            let bundleContent = `<!DOCTYPE html>\n<html lang="vi">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n${combinedLibs}\n<style>\n${combinedCSS}\n</style>\n</head>\n<body>\n${rootHtml}\n${combinedExtraHtml}\n<script>\n${combinedJS}\n<\/script>\n</body>\n</html>`;

            let blob = new Blob([bundleContent], { type: 'text/html' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }

        renderFileList();
        window.openFile("index.html");

       // Mở Ô tổng hợp Tách & Gộp cho từng tầng (Đã sửa lại chỉ lấy đúng file .div của tầng)
        window.openMaster = function(tier) {
            currentActiveFile = `MASTER_TIER_${tier}`;
            if (!openTabs.includes(currentActiveFile)) openTabs.push(currentActiveFile);

            lineNumbers.style.display = 'none';
            codeEditor.style.display = 'none';
            masterSplitterView.style.display = 'flex';
            document.getElementById('currentFileName').innerText = `Tách/Gộp Tầng ${tier}`;
            document.getElementById('master-title').innerText = `📥 Ô Gộp/Tách Dữ Liệu Tầng ${tier}`;

            let combinedHtml = "";
            let combinedCss = "";
            let combinedJs = "";

            // Chỉ gom nội dung từ các file .div thực sự thuộc tầng này
            Object.keys(projectFiles).forEach(f => {
                if (f.startsWith(`html/tang${tier}/`) && f.endsWith('.div')) {
                    combinedHtml += projectFiles[f].content + "\n";
                }
                if (f.startsWith(`css/tang${tier}/`)) {
                    combinedCss += projectFiles[f].content + "\n";
                }
                if (f.startsWith(`js/tang${tier}/`)) {
                    combinedJs += projectFiles[f].content + "\n";
                }
            });

            masterTextarea.value = `<!-- HTML Tổng hợp Tầng ${tier} -->\n${combinedHtml}\n<style>\n${combinedCss}\n</style>\n<script>\n${combinedJs}\n<\/script>`;
            updateMasterLineNumbers();
            renderFileList();
            renderTabs();
        }




        // Bấm nút Tách dữ liệu vào các file con dạng .div
        window.processMasterSplitter = function() {
            let tier = currentActiveFile.split('_')[2];
            let rawContent = masterTextarea.value;
            parseAndDistributeMasterContent(tier, rawContent, true);
        }

        // Logic phân tách và gom toàn bộ khối div vào file đuôi .div của tầng
        function parseAndDistributeMasterContent(tier, content, showAlert = false) {
            let cssMatch = content.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
            let extractedCss = cssMatch ? cssMatch[1].trim() : "";

            let scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
            let match;
            let jsParts = [];
            while ((match = scriptRegex.exec(content)) !== null) {
                if (match[1].trim() !== "") {
                    jsParts.push(match[1].trim());
                }
            }
            let extractedJs = jsParts.join("\n\n");

            let cleanHtml = content
                .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
                .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                .trim();

            let divFiles = Object.keys(projectFiles).filter(f => f.startsWith(`html/tang${tier}/`) && f.endsWith('.div')).sort();
            
            let targetDivFile = "";
            if (divFiles.length > 0) {
                targetDivFile = divFiles[0];
            } else {
                targetDivFile = `html/tang${tier}/content.div`;
                projectFiles[targetDivFile] = { type: "html", content: "" };
            }

            projectFiles[targetDivFile].content = cleanHtml;

            let cssFiles = Object.keys(projectFiles).filter(f => f.startsWith(`css/tang${tier}/`)).sort();
            if (cssFiles.length > 0 && extractedCss) {
                projectFiles[cssFiles[0]].content = extractedCss;
            }

            let jsFiles = Object.keys(projectFiles).filter(f => f.startsWith(`js/tang${tier}/`)).sort();
            if (jsFiles.length > 0 && extractedJs) {
                projectFiles[jsFiles[0]].content = extractedJs;
            }

            saveData();
            if (typeof syncToFirebase === 'function') syncToFirebase();
            if (typeof renderFileList === 'function') renderFileList();
            
            if (showAlert) {
                alert(`Đã tách thành công toàn bộ khối div vào file (${targetDivFile}) của Tầng ${tier}!`);
            }
        }
